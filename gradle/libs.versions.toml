[versions]

java = "17"
filament = "2.4.0"
filamentPlatform = "1.9.0" # https://git.karmakrafts.dev/kk/prebuilts/filament-platform/-/packages
kotlin = "2.4.21" # https://github.com/JetBrains/kotlin/releases
kotlinxCoroutines = "1.11.0" # https://github.com/Kotlin/kotlinx.coroutines/releases
kotlinxSerialization = "1.11.0" # https://github.com/Kotlin/kotlinx.serialization/releases
kotlinxAtomicfu = "0.33.0" # https://github.com/Kotlin/kotlinx-atomicfu/releases
kotlinxIo = "0.9.1" # https://github.com/Kotlin/kotlinx-io/releases
androidGradle = "9.4.1" # https://developer.android.com/reference/tools/gradle-api
dokka = "2.2.0" # https://github.com/Kotlin/dokka/releases
karmaConventions = "1.22.3" # https://github.com/karmakrafts/karma-conventions/tags
jna = "5.19.1" # https://github.com/java-native-access/jna/tags
oshi = "7.7.2" # https://github.com/oshi/oshi

[libraries]

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinxAtomicfu" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kotlinx-io-bytestring = { module = "org.jetbrains.kotlinx:kotlinx-io-bytestring", version.ref = "kotlinxIo" }

jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

oshi-core = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }

[plugins]

android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradle" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
karmaConventions = { id = "dev.karmakrafts.conventions.karma-conventions", version.ref = "karmaConventions" }